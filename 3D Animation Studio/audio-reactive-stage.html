<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Reactive Stage</title>
  <style>
    :root{--bg:#050505;--panel:#101010;--line:#282828;--text:#f8f3ee;--muted:#8b8580;--accent:#ff2a2a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
    .app{width:min(1120px,100%);display:grid;grid-template-columns:1fr 360px;border:1px solid rgba(255,42,42,.25);border-radius:14px;overflow:hidden;background:#080808}
    canvas{width:100%;height:620px;display:block;background:radial-gradient(circle at center,#180808,#050505 62%)}
    aside{padding:24px;border-left:1px solid var(--line);background:#0d0d0d}
    .brand,label,button{font:12px "Space Mono",monospace;text-transform:uppercase;letter-spacing:.13em}.brand{color:var(--accent);margin-bottom:46px}
    h1{font-size:40px;line-height:.95;margin:0 0 14px}p{color:var(--muted);line-height:1.6}
    label{display:block;color:var(--muted);margin:22px 0 8px}input{width:100%;accent-color:var(--accent)}button{width:100%;margin-top:18px;background:var(--accent);border:0;border-radius:6px;color:#080808;padding:13px;font-weight:900;cursor:pointer}
    @media(max-width:860px){.app{grid-template-columns:1fr}canvas{height:460px}aside{border-left:0;border-top:1px solid var(--line)}}
  </style>
</head>
<body>
  <main class="app"><canvas id="canvas"></canvas><aside><div class="brand">Audio Reactive Stage</div><h1>Prototype visualizers without audio setup.</h1><p>Fake-reactive controls make this easy to adapt for music apps, podcast tools, event pages, visual identity systems, or livestream overlays.</p><label for="energy">Energy</label><input id="energy" type="range" min="10" max="100" value="62"><label for="complexity">Complexity</label><input id="complexity" type="range" min="8" max="48" value="28"><button id="pulse">Pulse hit</button></aside></main>
  <script>
    const c=canvas,ctx=c.getContext("2d");let hit=0;function size(){c.width=c.offsetWidth*devicePixelRatio;c.height=c.offsetHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}function draw(t){const w=c.offsetWidth,h=c.offsetHeight,e=+energy.value,steps=+complexity.value;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2,h/2);for(let i=0;i<steps;i++){const a=i/steps*Math.PI*2+t*.0005;const r=80+Math.sin(t*.003+i)*e+hit;ctx.strokeStyle=i%3?"rgba(255,42,42,.55)":"rgba(255,244,232,.65)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(Math.cos(a)*r*.35,Math.sin(a)*r*.2,r*.62,0,Math.PI*1.2);ctx.stroke()}ctx.restore();hit*=.9;requestAnimationFrame(draw)}pulse.onclick=()=>hit=80;addEventListener("resize",size);size();draw(0);
  </script>
</body>
</html>
