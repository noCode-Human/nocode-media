<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecommerce Configurator</title>
  <style>
    :root{--bg:#f7f4ee;--ink:#101010;--muted:#746d65;--line:#d9d1c7;--accent:#ff2a2a;--mat:#ff2a2a;--angle:-22deg}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .app{width:min(1160px,calc(100% - 32px));margin:auto;padding:30px 0;display:grid;grid-template-columns:1fr 520px;gap:28px;align-items:center;min-height:100vh}
    .kicker,button,.price{font:12px "Space Mono",monospace;text-transform:uppercase;letter-spacing:.13em}.kicker{color:var(--accent)}
    h1{font-size:clamp(46px,8vw,96px);line-height:.9;margin:18px 0}.lead{color:var(--muted);font-size:18px;line-height:1.6}
    .stage{height:560px;background:#fffaf2;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;perspective:900px;overflow:hidden}
    .object{width:230px;height:320px;border-radius:34px;background:linear-gradient(145deg,var(--mat),#fff6ea);transform:rotateY(var(--angle)) rotateX(10deg);box-shadow:40px 50px 100px rgba(0,0,0,.16);transition:.55s cubic-bezier(.2,.8,.2,1);position:relative}
    .object:before{content:"";position:absolute;inset:34px;border:2px solid rgba(0,0,0,.18);border-radius:28px}.object:after{content:"noCode";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);font:22px "Space Mono",monospace;letter-spacing:.18em}
    .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}button{border:1px solid var(--line);background:white;border-radius:6px;padding:13px;cursor:pointer}button:hover,button.active{border-color:var(--accent);color:var(--accent)}
    .price{margin-top:18px;color:var(--muted)}
    @media(max-width:900px){.app{grid-template-columns:1fr}.stage{height:460px}.controls{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main class="app"><section><div class="kicker">Commerce configurator</div><h1>Let shoppers test the object before checkout.</h1><p class="lead">Use this for paid templates, hardware mockups, merch, courses, digital packs, plugin demos, or premium resource pages.</p><div class="controls"><button class="active" data-color="#ff2a2a">Red</button><button data-color="#101010">Carbon</button><button data-color="#fff4e8">Ivory</button><button data-angle="-44deg">Left</button><button data-angle="0deg">Front</button><button data-angle="34deg">Right</button></div><div class="price" id="readout">$29 / Red / Left angle</div></section><section class="stage"><div class="object" id="object"></div></section></main>
  <script>
    let color="Red",angle="Left angle";document.querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>{if(btn.dataset.color){document.documentElement.style.setProperty("--mat",btn.dataset.color);document.querySelectorAll("[data-color]").forEach(b=>b.classList.toggle("active",b===btn));color=btn.textContent}if(btn.dataset.angle){document.documentElement.style.setProperty("--angle",btn.dataset.angle);angle=`${btn.textContent} angle`}readout.textContent=`$29 / ${color} / ${angle}`}));
  </script>
</body>
</html>
