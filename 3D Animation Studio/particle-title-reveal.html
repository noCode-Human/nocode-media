<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle Title Reveal</title>
  <style>
    :root{--bg:#050505;--panel:#101010;--line:#292929;--text:#f8f3ee;--muted:#8b8580;--accent:#ff2a2a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
    .app{width:min(1100px,100%);border:1px solid rgba(255,42,42,.28);border-radius:14px;overflow:hidden;background:#080808}
    header{display:flex;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line);font:12px "Space Mono",monospace;text-transform:uppercase;letter-spacing:.14em}
    .stage{height:540px;position:relative;overflow:hidden;background:radial-gradient(circle at center,#170808,#050505 60%)}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    .copy{position:absolute;left:28px;bottom:28px;max-width:520px;z-index:2}
    h1{font-size:clamp(42px,7vw,86px);line-height:.9;margin:0}.copy p{color:var(--muted);line-height:1.6}
    .controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;padding:16px 20px;background:#101010;border-top:1px solid var(--line)}
    input,select,button{background:#171717;border:1px solid #333;color:var(--text);border-radius:6px;padding:12px;font:12px "Space Mono",monospace}
    button{background:var(--accent);color:#080808;font-weight:900;cursor:pointer}
    @media(max-width:760px){.stage{height:480px}.controls{grid-template-columns:1fr}.copy{position:relative;left:auto;bottom:auto;padding:20px;background:#080808}}
  </style>
</head>
<body>
  <main class="app">
    <header><span>Particle Title Reveal</span><span id="count">240 particles</span></header>
    <section class="stage"><canvas id="canvas"></canvas><div class="copy"><h1 id="headline">Make the launch feel charged.</h1><p>Canvas particles orbit, scatter, and settle around the message. Good for hero sections, title cards, and announcement pages.</p></div></section>
    <section class="controls"><input id="text" value="Make the launch feel charged."><select id="density"><option value="160">Light</option><option value="240" selected>Medium</option><option value="380">Heavy</option></select><button id="burst">Burst</button></section>
  </main>
  <script>
    const canvas=document.querySelector("#canvas");
    const ctx=canvas.getContext("2d");
    const headline=document.querySelector("#headline");
    const text=document.querySelector("#text");
    const density=document.querySelector("#density");
    const count=document.querySelector("#count");
    const burstButton=document.querySelector("#burst");
    let particles=[];
    let burst=0;
    let width=1;
    let height=1;

    function measure(){
      const rect=canvas.parentElement.getBoundingClientRect();
      width=Math.max(320,rect.width);
      height=Math.max(360,rect.height);
      canvas.width=Math.round(width*devicePixelRatio);
      canvas.height=Math.round(height*devicePixelRatio);
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    }

    function make(){
      measure();
      particles=Array.from({length:+density.value},(_,i)=>({
        x:width*(.42+Math.cos(i)*.08),
        y:height*(.38+Math.sin(i)*.08),
        a:Math.random()*Math.PI*2,
        r:1.6+Math.random()*3.2,
        s:.45+Math.random()*1.7
      }));
      count.textContent=`${particles.length} particles`;
    }

    function draw(t){
      ctx.clearRect(0,0,width,height);
      const cx=width*.62;
      const cy=height*.36;
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      particles.forEach((p,i)=>{
        p.a+=.006*p.s;
        const radius=54+(i%70)*2.7+burst;
        const tx=cx+Math.cos(p.a+i*.17)*radius;
        const ty=cy+Math.sin(p.a*1.35+i*.21)*radius*.52;
        p.x+=(tx-p.x)*.035;
        p.y+=(ty-p.y)*.035;
        ctx.fillStyle=i%8===0?"#fff4e8":"#ff2a2a";
        ctx.globalAlpha=.5+Math.sin(t*.004+i)*.32;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
      });
      ctx.restore();
      ctx.globalAlpha=.18;
      ctx.strokeStyle="#ff2a2a";
      ctx.beginPath();
      ctx.ellipse(cx,cy,Math.max(120,width*.18)+burst*.15,Math.max(44,height*.11),Math.sin(t*.0006)*.5,0,Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha=1;
      burst*=.93;
      requestAnimationFrame(draw);
    }

    text.addEventListener("input",()=>headline.textContent=text.value);
    density.addEventListener("change",make);
    burstButton.addEventListener("click",()=>burst=140);
    new ResizeObserver(make).observe(canvas.parentElement);
    addEventListener("resize",make);
    requestAnimationFrame(()=>{make();draw(0);});
  </script>
</body>
</html>
