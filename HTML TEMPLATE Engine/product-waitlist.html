<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Waitlist</title>
  <style>
    :root { --bg:#f2f0ec; --ink:#101010; --muted:#736e66; --line:#d2ccc2; --panel:#fffaf2; --accent:#ff2a2a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, sans-serif; }
    .shell { width:min(1120px, calc(100% - 32px)); margin:auto; padding:30px 0; }
    header { display:flex; justify-content:space-between; align-items:center; padding-bottom:18px; border-bottom:1px solid var(--line); font:12px "Space Mono", ui-monospace, monospace; text-transform:uppercase; letter-spacing:.13em; }
    .hero { display:grid; grid-template-columns:1.1fr .9fr; gap:30px; align-items:center; min-height:680px; }
    h1 { font-size:clamp(46px,8vw,96px); line-height:.92; margin:0 0 18px; }
    p { color:var(--muted); line-height:1.6; font-size:17px; }
    form { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:22px; display:grid; gap:12px; }
    label { font:11px "Space Mono", ui-monospace, monospace; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
    input, select { width:100%; padding:14px; border:1px solid var(--line); background:white; border-radius:4px; font:15px Inter, sans-serif; }
    button { border:0; background:var(--accent); color:#111; border-radius:4px; padding:15px; font-weight:900; cursor:pointer; }
    .proof { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:-80px; position:relative; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; min-height:150px; }
    .card strong { display:block; font-size:30px; margin-bottom:8px; }
    .card span { color:var(--muted); font:11px "Space Mono", ui-monospace, monospace; text-transform:uppercase; }
    .badge { display:inline-flex; border:1px solid var(--ink); padding:8px 10px; border-radius:999px; font:11px "Space Mono", ui-monospace, monospace; text-transform:uppercase; margin-bottom:18px; }
    @media(max-width:820px){ .hero,.proof{grid-template-columns:1fr;} .proof{margin-top:0;} header{align-items:flex-start; flex-direction:column; gap:10px;} }
  </style>
</head>
<body>
  <div class="shell">
    <header><span>Waitlist</span><span>Private beta opens soon</span></header>
    <main>
      <section class="hero">
        <div>
          <span class="badge">Early access</span>
          <h1>A tiny product for creators who hate messy launches.</h1>
          <p>Collect serious buyers, learn what they need, and invite the right people first. Swap this copy for your own product promise.</p>
        </div>
        <form>
          <label for="name">Name</label><input id="name" value="Rachel Builder">
          <label for="email">Email</label><input id="email" value="hello@example.com">
          <label for="role">What are you building?</label><select id="role"><option>Template or digital product</option><option>SaaS app</option><option>Content business</option></select>
          <button>Join the list</button>
        </form>
      </section>
      <section class="proof">
        <div class="card"><strong>120</strong><span>Founding seats</span></div>
        <div class="card"><strong>48h</strong><span>Invite window</span></div>
        <div class="card"><strong>$9</strong><span>Early price</span></div>
      </section>
    </main>
  </div>
</body>
</html>
